name: Release

# 手工在 GitHub 打一个 Release（published）才触发，推分支、开 PR 都不会跑。
#
#   1. 类型检查 + next build（build 挂了说明产物有问题，不该出镜像）
#   2. 构建镜像到本地，起容器冒烟（/、/robots.txt、/sitemap.xml 必须 200）
#   3. 冒烟通过才推 TCR：<版本号> / alpha_mobile-master-<sha> / latest
#
# Secrets：
#   TCR_USERNAME / TCR_PASSWORD   腾讯云 TCR 账号与密码（与 delta 共用同一套）

on:
  release:
    types: [published]

permissions:
  contents: read

# 发布流程不能被打断，同一 ref 也不允许并发
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_IMAGE: ccr.ccs.tencentyun.com/zhouzhou/alpha_mobile

jobs:
  quality:
    name: 构建校验
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # next build 自带 tsc 检查；不要单独先跑 tsc —— next-env.d.ts 是构建产物，
      # 干净检出时还不存在，先跑 tsc 会因为缺少 "*.css" 声明而误报
      - name: 构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  publish:
    name: 构建并发布镜像
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 检查 TCR 凭据
        run: |
          if [ -z "${TCR_USERNAME}" ] || [ -z "${TCR_PASSWORD}" ]; then
            echo "::error::缺少 TCR_USERNAME / TCR_PASSWORD，无法推镜像。去仓库 Settings → Secrets 里补。"
            exit 1
          fi

      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=alpha_mobile-master-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "本次标签：$VERSION / alpha_mobile-master-$(git rev-parse HEAD) / latest"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      # 先构建到本地不推送，冒烟挂了就不会污染镜像仓库。
      # 只保留 cache-from：发布频率低，不值得把全量层传回 Actions 缓存
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: alpha_mobile-ci:smoke
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      # 三个静态路由都不依赖运行时接口，适合当存活探针
      - name: 容器冒烟测试
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 alpha_mobile-ci:smoke

          for path in / /robots.txt /sitemap.xml; do
            code=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}" || true)
              if [ "$code" = "200" ]; then echo "${path} 第 ${i} 次探测 200"; break; fi
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "::error::冒烟失败：${path} 返回 HTTP ${code}"
              docker logs smoke || true
              exit 1
            fi
          done

          # 详情页依赖外部接口，只做提示不阻断发布
          detail_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/lost/1 || true)
          echo "参考：/lost/1 -> HTTP ${detail_code}（依赖 api.91xungou.com，不阻断）"

          docker rm -f smoke

      - name: 登录腾讯云 TCR
        run: echo "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" -u "$TCR_USERNAME" --password-stdin

      - name: 推送镜像
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" "$SHA_TAG" latest; do
            echo "→ 推送 ${TCR_IMAGE}:${tag}"
            docker tag alpha_mobile-ci:smoke "${TCR_IMAGE}:${tag}"
            docker push "${TCR_IMAGE}:${tag}"
          done

      - name: 写入运行摘要
        if: always()
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          {
            echo "### 镜像发布结果"
            echo ""
            echo "| Registry | Tag |"
            echo "| --- | --- |"
            echo "| \`${TCR_IMAGE}\` | \`${VERSION}\` / \`${SHA_TAG}\` / \`latest\` |"
            echo ""
            echo "生产 compose 用 \`:latest\`；回滚把它换成 \`${SHA_TAG}\` 即可。"
          } >> "$GITHUB_STEP_SUMMARY"
